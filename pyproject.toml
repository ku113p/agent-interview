[project]
name = "interview"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "langgraph>=1.0.5",
    "langfuse>=2.50.0",
    "langgraph-checkpoint-postgres>=3.0.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "redis>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.40.0",
    "openai>=1.59.0",
    "psycopg-binary>=3.3.2",
    "httpx>=0.28.1",
    "mem0ai>=0.1.0",
    "qdrant-client>=1.7.0",
    "markdown>=3.10",
]
[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.10",
    "types-markdown>=3.10.0.20251106",
]
[tool.ruff]
line-length = 88
target-version = "py312"  # Start with 3.12 target for safety
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-select = ["PLR0915"]
ignore = []

[tool.ruff.lint.pylint]
max-statements = 25
[tool.mypy]
python_version = "3.12" # Mypy execution version
strict = true
disallow_untyped_defs = true
ignore_missing_imports = false
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

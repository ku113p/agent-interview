<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            padding: 1rem;
            border-radius: 8px;
            background: var(--pico-card-background-color);
            box-shadow: var(--pico-card-box-shadow);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--pico-primary);
        }
        .refresh-btn {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>Admin Dashboard</strong></li>
            </ul>
            <ul>
                <li><a href="#" onclick="fetchData()">Refresh</a></li>
            </ul>
        </nav>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="stat-value" id="total-users">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Input Tokens</h3>
                <div class="stat-value" id="total-input">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Output Tokens</h3>
                <div class="stat-value" id="total-output">-</div>
            </div>
        </div>

        <article>
            <header>User Usage Monitoring</header>
            <figure>
                <table id="usage-table">
                    <thead>
                        <tr>
                            <th scope="col">User ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Input Tokens</th>
                            <th scope="col">Output Tokens</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </figure>
        </article>
    </main>

    <script>
        async function fetchData() {
            const tbody = document.querySelector('#usage-table tbody');
            tbody.innerHTML = '<tr><td colspan="5" aria-busy="true">Loading...</td></tr>';
            
            try {
                const response = await fetch('/v1/admin/usage?limit=100');
                const data = await response.json();
                
                // Update stats
                document.getElementById('total-users').textContent = data.total_users;
                document.getElementById('total-input').textContent = data.total_usage.input_tokens.toLocaleString();
                document.getElementById('total-output').textContent = data.total_usage.output_tokens.toLocaleString();
                
                // Update table
                tbody.innerHTML = '';
                data.users.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.user.id}</td>
                        <td>${item.user.full_name || '-'}</td>
                        <td>${item.user.email}</td>
                        <td>${item.usage.input_tokens.toLocaleString()}</td>
                        <td>${item.usage.output_tokens.toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                tbody.innerHTML = '<tr><td colspan="5" style="color: red;">Error loading data</td></tr>';
            }
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
